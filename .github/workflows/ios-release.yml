name: iOS Signed Release & TestFlight Pipeline

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'Upload directly to TestFlight after successful build'
        required: true
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-signed-ipa:
    name: Build Signed Release IPA
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Validate Apple Credentials Availability
        id: check-secrets
        env:
          CERT_SECRET: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          PASS_SECRET: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE_SECRET: ${{ secrets.APP_STORE_PROVISIONING_PROFILE_BASE64 }}
          TEAM_SECRET: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_SECRET: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 || secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          ASC_KEY_ID_SECRET: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_SECRET: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          if [ -n "$CERT_SECRET" ] && [ -n "$PASS_SECRET" ] && [ -n "$PROFILE_SECRET" ] && [ -n "$TEAM_SECRET" ]; then
            echo "ALL_CREDENTIALS_SET=true" >> $GITHUB_ENV
            echo "Apple Developer signing credentials detected in repository secrets."
          else
            echo "ALL_CREDENTIALS_SET=false" >> $GITHUB_ENV
            echo "::warning ::Apple Developer credentials are not yet configured in GitHub Secrets."
            echo "Required Signing Secrets:"
            echo "  - APPLE_CERTIFICATE_BASE64"
            echo "  - APPLE_CERTIFICATE_PASSWORD"
            echo "  - APP_STORE_PROVISIONING_PROFILE_BASE64"
            echo "  - APPLE_TEAM_ID"
            echo "Proceeding with unsigned archive verification..."
          fi

          if [ -n "$ASC_KEY_SECRET" ] && [ -n "$ASC_KEY_ID_SECRET" ] && [ -n "$ASC_ISSUER_SECRET" ]; then
            echo "HAS_ASC_KEY=true" >> $GITHUB_ENV
            echo "App Store Connect API credentials detected."
          else
            echo "HAS_ASC_KEY=false" >> $GITHUB_ENV
            echo "App Store Connect API credentials not found or incomplete."
          fi

      - name: Setup Temporary Keychain and Install Signing Assets
        if: env.ALL_CREDENTIALS_SET == 'true'
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          
          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Import Distribution Certificate
          CERT_PATH=$RUNNER_TEMP/distribution.p12
          echo -n "${{ secrets.APPLE_CERTIFICATE_BASE64 }}" | base64 --decode -o "$CERT_PATH"
          security import "$CERT_PATH" -P "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Set as default and add to keychain search list
          security default-keychain -s "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          
          # Install Provisioning Profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_PATH=~/Library/MobileDevice/Provisioning\ Profiles/JobHunterr_AppStore.mobileprovision
          echo -n "${{ secrets.APP_STORE_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode -o "$PROFILE_PATH"
          
          # Extract UUID and copy profile by UUID as required by Xcode
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< $(security cms -D -i "$PROFILE_PATH"))
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision
          echo "Installed provisioning profile: JobHunterr_AppStore (UUID: $PROFILE_UUID)"

      - name: Prepare Export Options Plist
        run: |
          mkdir -p build/Export
          TEAM_ID="${{ secrets.APPLE_TEAM_ID }}"
          if [ -z "$TEAM_ID" ]; then
            TEAM_ID="VX698YBG86"
          fi
          
          cat <<EOF > build/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>destination</key>
              <string>export</string>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.jobhunterr.jobhunterr20</key>
                  <string>JobHunterr_AppStore</string>
              </dict>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
              <key>manageAppVersionAndBuildNumber</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Build Release Archive
        run: |
          mkdir -p build/Release
          TEAM_ID="${{ secrets.APPLE_TEAM_ID }}"
          if [ -z "$TEAM_ID" ]; then
            TEAM_ID="VX698YBG86"
          fi
          
          if [ "$ALL_CREDENTIALS_SET" = "true" ]; then
            echo "Building signed Release Archive..."
            xcodebuild -project JobHunterriOS/JobHunterriOS.xcodeproj \
                       -scheme JobHunterr \
                       -configuration Release \
                       -destination 'generic/platform=iOS' \
                       -archivePath build/Release/Jobhunterr.xcarchive \
                       DEVELOPMENT_TEAM="$TEAM_ID" \
                       CODE_SIGN_STYLE="Manual" \
                       CODE_SIGN_IDENTITY="Apple Distribution" \
                       PROVISIONING_PROFILE_SPECIFIER="JobHunterr_AppStore" \
                       archive
          else
            echo "Building unsigned Release Archive..."
            xcodebuild -project JobHunterriOS/JobHunterriOS.xcodeproj \
                       -scheme JobHunterr \
                       -configuration Release \
                       -destination 'generic/platform=iOS' \
                       -archivePath build/Release/Jobhunterr.xcarchive \
                       CODE_SIGNING_ALLOWED=NO \
                       CODE_SIGNING_REQUIRED=NO \
                       CODE_SIGN_IDENTITY="" \
                       archive
          fi

      - name: Export Signed IPA Package
        if: env.ALL_CREDENTIALS_SET == 'true'
        run: |
          echo "Exporting IPA package..."
          xcodebuild -exportArchive \
                     -archivePath build/Release/Jobhunterr.xcarchive \
                     -exportPath build/Export \
                     -exportOptionsPlist build/ExportOptions.plist
          
          echo "IPA export complete:"
          ls -la build/Export/

      - name: Verify Signed IPA Package
        if: env.ALL_CREDENTIALS_SET == 'true'
        run: |
          IPA_FILE=$(find build/Export -name "*.ipa" | head -n 1)
          if [ -z "$IPA_FILE" ]; then
            echo "::error ::No IPA file found in build/Export!"
            exit 1
          fi
          echo "========================================================"
          echo "Verifying Signed IPA: $IPA_FILE"
          echo "========================================================"
          
          UNZIP_DIR=$RUNNER_TEMP/ipa_inspect
          mkdir -p "$UNZIP_DIR"
          unzip -q "$IPA_FILE" -d "$UNZIP_DIR"
          
          APP_PATH=$(find "$UNZIP_DIR/Payload" -name "*.app" -maxdepth 1)
          echo "App Bundle: $APP_PATH"
          
          echo "--- Code Signature Verification ---"
          codesign -dv --verbose=4 "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          
          echo "--- Embedded Provisioning Profile Details ---"
          security cms -D -i "$APP_PATH/embedded.mobileprovision" > "$UNZIP_DIR/profile.plist"
          /usr/libexec/PlistBuddy -c "Print :Name" "$UNZIP_DIR/profile.plist"
          /usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$UNZIP_DIR/profile.plist"
          /usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$UNZIP_DIR/profile.plist"
          /usr/libexec/PlistBuddy -c "Print :ExpirationDate" "$UNZIP_DIR/profile.plist"
          
          rm -rf "$UNZIP_DIR"
          echo "Signature verification completed successfully."

      - name: Upload Release Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jobhunterr-Release-Archive
          path: build/Release/Jobhunterr.xcarchive
          retention-days: 14

      - name: Upload Signed IPA Artifact
        if: env.ALL_CREDENTIALS_SET == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Jobhunterr-Production-IPA
          path: build/Export/*.ipa
          retention-days: 30

      - name: Upload to TestFlight (Optional / Authorized)
        if: env.ALL_CREDENTIALS_SET == 'true' && github.event.inputs.upload_to_testflight == 'true' && env.HAS_ASC_KEY == 'true'
        env:
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 || secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          echo "Preparing App Store Connect API Key..."
          mkdir -p ~/.appstoreconnect/private_keys
          AUTH_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo -n "$ASC_PRIVATE_KEY" | base64 --decode -o "$AUTH_KEY_PATH"
          chmod 600 "$AUTH_KEY_PATH"
          
          IPA_FILE=$(find build/Export -name "*.ipa" | head -n 1)
          echo "Uploading $IPA_FILE to TestFlight..."
          
          if xcrun --find altool &>/dev/null; then
            echo "Uploading using xcrun altool..."
            xcrun altool --upload-app \
                         --type ios \
                         --file "$IPA_FILE" \
                         --apiKey "$ASC_KEY_ID" \
                         --apiIssuer "$ASC_ISSUER" \
                         --show-progress
          else
            echo "altool not found, uploading using xcodebuild..."
            cat <<EOF > build/UploadExportOptions.plist
            <?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0">
            <dict>
                <key>destination</key>
                <string>upload</string>
                <key>method</key>
                <string>app-store</string>
                <key>signingStyle</key>
                <string>manual</string>
                <key>signingCertificate</key>
                <string>Apple Distribution</string>
                <key>provisioningProfiles</key>
                <dict>
                    <key>com.jobhunterr.jobhunterr20</key>
                    <string>JobHunterr_AppStore</string>
                </dict>
                <key>teamID</key>
                <string>${{ secrets.APPLE_TEAM_ID }}</string>
                <key>uploadSymbols</key>
                <true/>
                <key>manageAppVersionAndBuildNumber</key>
                <true/>
            </dict>
            </plist>
            EOF
            xcodebuild -exportArchive \
                       -archivePath build/Release/Jobhunterr.xcarchive \
                       -exportOptionsPlist build/UploadExportOptions.plist \
                       -allowProvisioningUpdates \
                       -authenticationKeyPath "$AUTH_KEY_PATH" \
                       -authenticationKeyID "$ASC_KEY_ID" \
                       -authenticationKeyIssuerID "$ASC_ISSUER"
          fi
          echo "TestFlight upload step completed."

      - name: Clean Temporary Keychain and Credentials
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -rf ~/Library/MobileDevice/Provisioning\ Profiles/JobHunterr_AppStore.mobileprovision || true
          rm -rf ~/.appstoreconnect/private_keys || true
          echo "Temporary credentials wiped."
